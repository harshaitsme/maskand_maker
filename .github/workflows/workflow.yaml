name: Mask & Maker - Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push Docker images to Docker Hub"
        required: true
        type: boolean
        default: true
      custom_tag:
        description: "Optional custom image tag (e.g. v1.0.0, rc-1)"
        required: false
        type: string
        default: ""

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'harshaitsme' }}

jobs:
  # ==============================================================
  # Stage 1: Quality Gate - TypeCheck and TypeScript Compilation
  # ==============================================================
  test-and-typecheck:
    name: "Test & Typecheck: ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog-service
            path: catalog-service
          - name: artisan-service
            path: artisan-service
          - name: content-service
            path: content-service
          - name: verify-service
            path: verify-service
          - name: order-service
            path: order-service
          - name: search-service
            path: search-service
          - name: identity-service
            path: identity-service
          - name: portal-service
            path: portal-service
          - name: media-service
            path: media-service
          - name: settlement-service
            path: settlement-service
          - name: notification-service
            path: notification-service
          - name: api-gateway
            path: api-gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "${{ matrix.service.path }}/package-lock.json"

      - name: Install Dependencies
        working-directory: ${{ matrix.service.path }}
        run: npm ci

      - name: Run Typecheck
        working-directory: ${{ matrix.service.path }}
        run: npm run typecheck

      - name: Test Production Build
        working-directory: ${{ matrix.service.path }}
        run: npm run build

  # ==============================================================
  # Stage 2: Containerization & Push to Docker Hub
  # ==============================================================
  build-and-push:
    name: "Docker Build & Push: ${{ matrix.service.image }}"
    needs: test-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: catalog-service
            context: catalog-service
            image: maskandmaker-catalog-service
          - name: artisan-service
            context: artisan-service
            image: maskandmaker-artisan-service
          - name: content-service
            context: content-service
            image: maskandmaker-content-service
          - name: verify-service
            context: verify-service
            image: maskandmaker-verify-service
          - name: order-service
            context: order-service
            image: maskandmaker-order-service
          - name: search-service
            context: search-service
            image: maskandmaker-search-service
          - name: identity-service
            context: identity-service
            image: maskandmaker-identity-service
          - name: portal-service
            context: portal-service
            image: maskandmaker-portal-service
          - name: media-service
            context: media-service
            image: maskandmaker-media-service
          - name: settlement-service
            context: settlement-service
            image: maskandmaker-settlement-service
          - name: notification-service
            context: notification-service
            image: maskandmaker-notification-service
          - name: api-gateway
            context: api-gateway
            image: maskandmaker-api-gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine if Push is Enabled
        id: push_eval
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_push=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_push=${{ github.event.inputs.push_to_registry }}" >> $GITHUB_OUTPUT
          else
            echo "should_push=true" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.push_eval.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/${{ matrix.service.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ github.event.inputs.custom_tag }},enable=${{ github.event.inputs.custom_tag != '' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.context }}
          file: ./${{ matrix.service.context }}/Dockerfile
          push: ${{ steps.push_eval.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ==============================================================
  # Stage 3: Deployment Summary & Status Notification
  # ==============================================================
  ci-summary:
    name: "CI/CD Summary Report"
    needs: [test-and-typecheck, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "## 🎭 Mask & Maker - CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Quality Gate (TypeCheck & Build)** | ${{ needs.test-and-typecheck.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Hub Build & Push** | ${{ needs.build-and-push.result == 'success' && '✅ Succeeded' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Microservices to Docker Hub (${{ env.DOCKERHUB_USER }})" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-catalog-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-artisan-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-content-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-verify-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-order-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-search-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-identity-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-portal-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-media-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-settlement-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-notification-service\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKERHUB_USER }}/maskandmaker-api-gateway\`" >> $GITHUB_STEP_SUMMARY
